[package]
name = "fluerd"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.2"
rayon = "1.12.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Contoh jika ingin menonaktifkan pedantic lint tertentu yang terlalu cerewet:
# module_name_repetitions = "allow"


[lib]
name = "fluerd"
crate-type = ["cdylib", "rlib"]
